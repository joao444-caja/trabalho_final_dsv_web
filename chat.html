<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mensagens | DM</title>
  <link rel="stylesheet" href="chat.css">
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="nav-link">Home</a>
    <a href="chat.html" class="nav-link active">Mensagens</a>
    <button id="logout-btn" class="logout-btn">Sair</button>
  </nav>

  <main class="welcome-container">
    <div class="card chat-card">
      <div class="chat-header">
        <h2>Chat Interativo</h2>
        <span class="status">● Online</span>
      </div>

      <!-- A caixa do chat fica 100% vazia de início -->
      <div id="chat-box" class="chat-box"></div>

      <form id="chat-form">
        <input type="text" id="chat-input" placeholder="Enviar mensagem..." required autocomplete="off">
        <button type="submit">Enviar</button>
      </form>
    </div>
  </main>

  <script src="script.js?v=3" defer></script>
</body>
</html>
