<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Projeto Web</title>
  <link rel="stylesheet" href="style.css?v=50">
</head>
<body>
  <div class="app-layout">
    <header class="app-header">
      <div class="logo">⚡ WebApp</div>
      <div class="user-info">
        <span>Olá, <strong id="header-username">Usuário</strong>!</span>
        <button id="logout-btn" class="logout-btn">Sair</button>
      </div>
    </header>

    <main class="dashboard-container">
      <!-- Chat Integrado -->
      <section class="card chat-card-integrated">
        <div class="card-header">
          <h3>Central de Mensagens</h3>
          <span class="status">● Online</span>
        </div>

        <div id="chat-box" class="chat-box"></div>

        <form id="chat-form">
          <input type="text" id="chat-input" placeholder="Digite sua mensagem..." required autocomplete="off">
          <button type="submit">Enviar</button>
        </form>
      </section>

      <!-- Painel Lateral -->
      <aside class="dashboard-sidebar">
        <div class="card widget-card">
          <h4>Perfil</h4>
          <div class="profile-avatar" id="avatar-initials">U</div>
          <p class="profile-name" id="profile-username">Carregando...</p>
          <span class="badge">Membro Ativo</span>
        </div>

        <div class="card widget-card">
          <h4>Ações Rápidas</h4>
          <div class="action-buttons">
            <button class="action-btn" id="clear-chat-btn">Limpar Chat</button>
          </div>
        </div>
      </aside>
    </main>
  </div>

  <script src="script.js?v=50" defer></script>
</body>
</html>
