<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boas-Vindas | Projeto Web</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="welcome-container">
    <div class="card">
      <span class="badge">GRUPO ESTRUPADOR DE PAU</span>
      <h1 id="greeting">Seja bem-vindo!</h1>
      <p>Digite seu nome para personalizar seu ambiente de aprendizado.</p>

      <form id="welcome-form">
        <input type="text" id="username" placeholder="Digite seu nome..." required autocomplete="off">
        <button type="submit">Entrar</button>
      </form>

      <div id="user-display" class="hidden">
        <p>Olá, <strong id="name-output"></strong>! O ambiente está pronto.</p>
        <button id="reset-btn" class="secondary-btn">Trocar Nome</button>
      </div>
    </div>
    <nav class="navbar">
  <a href="index.html" class="nav-link active">Home</a>
  <a href="chat.html" class="nav-link">Mensagens</a>
</nav>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
