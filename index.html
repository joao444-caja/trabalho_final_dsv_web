<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebApp</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Tela de Auth (Login e Cadastro) -->
  <div id="auth-screen" class="auth-container">
    <div class="auth-card">
      <div class="auth-tabs">
        <button id="tab-login" class="tab-btn active" type="button">Entrar</button>
        <button id="tab-register" class="tab-btn" type="button">Cadastrar</button>
      </div>

      <form id="login-form" class="auth-form active">
        <h2>Entrar na Conta</h2>
        <input type="text" id="login-user" placeholder="Usuário" required autocomplete="off">
        <input type="password" id="login-pass" placeholder="Senha" required>
        <button type="submit" class="btn-primary">Acessar</button>
      </form>

      <form id="register-form" class="auth-form">
        <h2>Criar Conta</h2>
        <input type="text" id="reg-user" placeholder="Novo Usuário" required autocomplete="off">
        <input type="password" id="reg-pass" placeholder="Nova Senha" required>
        <button type="submit" class="btn-primary">Criar Conta</button>
      </form>

      <div id="auth-message" class="auth-message"></div>
    </div>
  </div>

  <!-- Tela do Dashboard / Chat -->
  <div id="app-screen" class="app-layout" style="display: none;">
    <header class="app-header">
      <div class="logo">⚡ WebApp</div>
      <div class="user-info">
        <span>Olá, <strong id="header-username">Usuário</strong>!</span>
        <button id="logout-btn" class="logout-btn">Sair</button>
      </div>
    </header>

    <div class="dashboard-container">
      <main class="card chat-card-integrated">
        <div class="card-header">
          <h3>Central de Mensagens</h3>
          <span class="status">● Online</span>
        </div>
        
        <div id="chat-box"></div>

        <form id="chat-form">
          <input type="text" id="chat-input" placeholder="Digite sua mensagem..." required autocomplete="off">
          <button type="submit">Enviar</button>
        </form>
      </main>

      <aside class="dashboard-sidebar">
        <div class="card widget-card">
          <h4>Perfil</h4>
          <div class="profile-avatar" id="avatar-initials">U</div>
          <div class="profile-name" id="profile-username">Usuário</div>
          <span class="badge">Membro Ativo</span>
        </div>

        <div class="card widget-card">
          <h4>Ações Rápidas</h4>
          <button id="clear-chat-btn" class="action-btn">Limpar Chat</button>
        </div>
      </aside>
    </div>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
